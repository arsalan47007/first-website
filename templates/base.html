{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PulseCheck{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==================== RESET & BASE ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #ECFDF5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      direction: rtl;
      color: #1F2937;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(5, 150, 105, 0.04) 0%, transparent 50%);
    }

    /* ==================== HEADER / NAVBAR ==================== */
    .site-header {
      background: rgba(6, 78, 59, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 32px;
      border-radius: 20px;
      margin: 16px 20px 32px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 24px rgba(6, 78, 59, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 16px;
      z-index: 1000;
      flex-wrap: wrap;
      gap: 15px;
      animation: fadeInDown 0.6s ease;
    }

    .site-header strong {
      color: white;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .site-header strong::before {
      content: "❤️";
      font-size: 26px;
      animation: pulse-heart 2s ease-in-out infinite;
    }

    @keyframes pulse-heart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .site-header nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .site-header nav a {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .site-header nav a:hover {
      color: white;
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .site-header nav a i {
      margin-left: 6px;
    }

    .site-header nav a.active {
      color: white;
      background: #059669;
      border-color: #059669;
      box-shadow: 0 4px 16px rgba(5, 150, 105, 0.3);
    }

    /* ==================== AUTH AREA ==================== */
    .auth-area {
      display: flex;
      align-items: center;
      gap: 15px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
    }

    .auth-area .user-name {
      font-weight: 600;
      background: rgba(255, 255, 255, 0.12);
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .auth-area .user-name i {
      color: #10B981;
    }

    .auth-area .btn-login,
    .auth-area .btn-logout {
      color: white;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .auth-area .btn-login:hover {
      background: #059669;
      border-color: #059669;
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(5, 150, 105, 0.3);
    }

    .auth-area .btn-logout:hover {
      background: rgba(239, 68, 68, 0.4);
      border-color: rgba(239, 68, 68, 0.3);
      transform: scale(1.05);
    }

    /* ==================== MAIN CONTAINER ==================== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 40px 20px;
      flex: 1;
      width: 100%;
    }

    /* ==================== FOOTER ==================== */
    .site-footer {
      background: #064E3B;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      padding: 30px 20px 20px;
      margin-top: 40px;
      border-radius: 20px 20px 0 0;
    }

    .site-footer a {
      color: #10B981;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .site-footer a:hover {
      color: white;
      text-decoration: underline;
    }

    .site-footer .footer-links {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .site-footer .footer-links a {
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      transition: all 0.3s ease;
    }

    .site-footer .footer-links a:hover {
      color: white;
      text-decoration: none;
      transform: translateY(-2px);
    }

    .site-footer .footer-links a i {
      margin-left: 4px;
    }

    .site-footer .social-icons {
      margin-top: 12px;
    }

    .site-footer .social-icons a {
      color: rgba(255, 255, 255, 0.4);
      margin: 0 10px;
      font-size: 22px;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .site-footer .social-icons a:hover {
      color: white;
      transform: translateY(-4px) scale(1.1);
    }

    .site-footer .copyright {
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
    }

    .site-footer .copyright i {
      margin-left: 4px;
    }

    /* ==================== BUTTONS ==================== */
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: #059669;
      color: white;
      font-weight: 600;
      font-size: 15px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      text-align: center;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 20px rgba(5, 150, 105, 0.3);
    }

    .btn:hover {
      background: #047857;
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(5, 150, 105, 0.4);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #E5E7EB;
      color: #1F2937;
      box-shadow: none;
    }

    .btn-outline:hover {
      border-color: #059669;
      background: rgba(5, 150, 105, 0.06);
      transform: translateY(-3px);
    }

    .btn-danger {
      background: #EF4444;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background: #DC2626;
      box-shadow: 0 8px 30px rgba(239, 68, 68, 0.4);
    }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 768px) {
      .site-header {
        padding: 12px 16px;
        margin: 10px 10px 20px 10px;
        flex-direction: column;
        align-items: stretch;
        border-radius: 16px;
        top: 10px;
      }

      .site-header strong {
        font-size: 22px;
        justify-content: center;
      }

      .site-header nav {
        justify-content: center;
        width: 100%;
      }

      .site-header nav a {
        font-size: 13px;
        padding: 6px 14px;
      }

      .auth-area {
        justify-content: center;
        flex-wrap: wrap;
        width: 100%;
      }

      .container {
        padding: 0 12px 24px 12px;
      }

      .site-footer .footer-links {
        flex-direction: column;
        gap: 8px;
      }
    }

    @media (max-width: 480px) {
      .site-header strong {
        font-size: 18px;
      }

      .site-header nav a {
        font-size: 12px;
        padding: 4px 10px;
      }

      .btn {
        padding: 10px 20px;
        font-size: 14px;
        width: 100%;
      }

      .site-footer {
        padding: 20px 12px 16px 12px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <strong>PulseCheck</strong>
    <nav>
      <a href="/home/" class="active"><i class="fas fa-home"></i> خانه</a>
      <a href="/about/"><i class="fas fa-info-circle"></i> درباره</a>
      <a href="/add/"><i class="fas fa-plus-circle"></i> ثبت حال امروز</a>
      <a href="/report/"><i class="fas fa-chart-bar"></i> گزارش</a>
    </nav>
    <div class="auth-area">
      {% if user.is_authenticated %}
      <span class="user-name">
        <i class="fas fa-user-circle"></i> {{ user.username }}
      </span>
      <a href="/logout/" class="btn-logout">
        <i class="fas fa-sign-out-alt"></i> خروج
      </a>
      {% else %}
      <a href="/login/" class="btn-login">
        <i class="fas fa-sign-in-alt"></i> ورود
      </a>
      {% endif %}
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="/home/"><i class="fas fa-home"></i> خانه</a>
      <a href="/about/"><i class="fas fa-info-circle"></i> درباره ما</a>
      <a href="/add/"><i class="fas fa-plus-circle"></i> ثبت حال</a>
      <a href="/report/"><i class="fas fa-chart-bar"></i> گزارش</a>
      <a href="#"><i class="fas fa-envelope"></i> تماس با ما</a>
    </div>

    <div class="social-icons">
      <a href="#" aria-label="تلگرام"><i class="fab fa-telegram"></i></a>
      <a href="#" aria-label="اینستاگرام"><i class="fab fa-instagram"></i></a>
      <a href="#" aria-label="گیت‌هاب"><i class="fab fa-github"></i></a>
      <a href="#" aria-label="لینکدین"><i class="fab fa-linkedin"></i></a>
    </div>

    <div class="copyright">
      <i class="fas fa-copyright"></i> ۱۴۰۴ - پالس‌چک | تمامی حقوق محفوظ است
    </div>
  </footer>
</body>
</html>
